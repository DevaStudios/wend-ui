<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>wend-ui</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function () {
        var STORAGE_KEY = 'wend-theme';
        function currentTheme() {
          return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
        }
        function applyTheme(theme) {
          if (theme === 'dark') {
            document.documentElement.dataset.theme = 'dark';
          } else {
            delete document.documentElement.dataset.theme;
          }
        }
        function syncToggleButtons() {
          var isDark = currentTheme() === 'dark';
          document.querySelectorAll('.wend-theme-toggle').forEach(function (btn) {
            btn.setAttribute('aria-pressed', String(isDark));
            btn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
          });
        }

        var stored = localStorage.getItem(STORAGE_KEY);
        applyTheme(stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

        window.wendToggleTheme = function () {
          var next = currentTheme() === 'dark' ? 'light' : 'dark';
          localStorage.setItem(STORAGE_KEY, next);
          applyTheme(next);
          syncToggleButtons();
        };

        document.addEventListener('DOMContentLoaded', syncToggleButtons);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@300;400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="build/wend-ui-web-components.css" />
    <link rel="stylesheet" href="global/docs.css" />
    <script type="module" src="build/wend-ui-web-components.esm.js"></script>
    <script nomodule src="build/wend-ui-web-components.js"></script>
    <script src="global/docs-nav.js"></script>
  </head>
  <body>
    <wend-docs-nav></wend-docs-nav>

    <div class="wend-page">
      <div class="wend-hero">
        <h1>wend-ui</h1>
        <p>A calm, considered design system.</p>
        <div class="wend-hero__ctas">
          <wend-button
            variant="primary"
            label="Get Started"
            onclick="location.href = 'docs/get-started/installation.html'"
          ></wend-button>
          <wend-button
            variant="secondary"
            label="View Components"
            onclick="location.href = 'docs/components/button.html'"
          ></wend-button>
        </div>
      </div>
    </div>
  </body>
</html>
